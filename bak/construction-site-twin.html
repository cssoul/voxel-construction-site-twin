// ========================================
// INSTANCED POOLS (static voxel batching)
// ========================================
const P = {};
class InstPool{
  constructor(geo, mat, opts={}){
    this.geo=geo; this.mat=mat; this.items=[]; this.opts=opts;
  }
  add(x,y,z, sx,sy,sz, ry=0,rx=0,rz=0, color=null){
    this.items.push([x,y,z,sx,sy,sz,ry,rx,rz,color]);
  }
  build(name){
    const n=this.items.length; if(!n) return null;
    const im = new THREE.InstancedMesh(this.geo, this.mat, n);
    const d=new THREE.Object3D(), c=new THREE.Color();
    const qx=new THREE.Quaternion(), qy=new THREE.Quaternion(), qz=new THREE.Quaternion(), q=new THREE.Quaternion();
    const AX=new THREE.Vector3(1,0,0), AY=new THREE.Vector3(0,1,0), AZ=new THREE.Vector3(0,0,1);
    for(let i=0;i<n;i++){
      const it=this.items[i];
      d.position.set(it[0],it[1],it[2]); d.scale.set(it[3],it[4],it[5]);
      qy.setFromAxisAngle(AY,it[6]); qx.setFromAxisAngle(AX,it[7]); qz.setFromAxisAngle(AZ,it[8]);
      q.copy(qy).multiply(qx).multiply(qz);
      d.quaternion.copy(q); d.updateMatrix();
      im.setMatrixAt(i, d.matrix);
      if(it[9]!=null){ im.setColorAt(i, c.set(it[9])); }
    }
    if(im.instanceColor) im.instanceColor.needsUpdate=true;
    im.castShadow = this.opts.shadow!==false;
    im.receiveShadow = this.opts.receive!==false;
    im.frustumCulled = false;
    im.name = name;
    scene.add(im); P[name]=im;
    return im;
  }
}

// 动态体素小方块 mesh（用于机械/车辆等少量对象）
function bx(mat,w,h,d,x,y,z,parent){
  const m=new THREE.Mesh(G.box,mat); m.scale.set(w,h,d); m.position.set(x,y,z);
  m.castShadow=true; m.receiveShadow=true; (parent||scene).add(m); return m;
}
function cy(mat,r,len,x,y,z,parent,axis='y'){
  const m=new THREE.Mesh(G.cyl,mat); m.scale.set(r*2,len,r*2); m.position.set(x,y,z);
  if(axis==='x') m.rotation.z=Math.PI/2; if(axis==='z') m.rotation.x=Math.PI/2;
  m.castShadow=true; m.receiveShadow=true; (parent||scene).add(m); return m;
}

// 路径：角点 → Chaikin 平滑 → 密集点列
function routeFromCorners(corners, iters=2){
  let pts = corners.map(c=>({x:c.x,z:c.z}));
  for(let k=0;k<iters;k++){
    const out=[];
    for(let i=0;i<pts.length;i++){
      const a=pts[i], b=pts[(i+1)%pts.length];
      out.push({x:a.x*.75+b.x*.25, z:a.z*.75+b.z*.25});
      out.push({x:a.x*.25+b.x*.75, z:a.z*.25+b.z*.75});
    }
    pts=out;
  }
  return pts;
}
class Follower{
  constructor(corners, s0=0, smooth=2){
    this.pts = routeFromCorners(corners, smooth);
    const n=this.pts.length; this.n=n;
    this.cum=[0]; let L=0;
    for(let i=0;i<n;i++){ const a=this.pts[i], b=this.pts[(i+1)%n]; L+=Math.hypot(b.x-a.x,b.z-a.z); this.cum.push(L); }
    this.total=L; this.s=((s0%L)+L)%L;
    this.stops=[];
    corners.forEach(c=>{
      if(c.stop){
        let best=0,bd=1e18;
        for(let i=0;i<n;i++){ const p=this.pts[i]; const d=(p.x-c.x)**2+(p.z-c.z)**2; if(d<bd){bd=d;best=i;} }
        this.stops.push({s:this.cum[best], dur:c.stop.dur, act:c.stop.act});
      }
    });
    this.stops.sort((a,b)=>a.s-b.s);
    this.stopIdx=0;
  }
  advance(ds){ this.s=((this.s+ds)%this.total+this.total)%this.total; }
  posAt(s,out){
    const n=this.n; s=((s%this.total)+this.total)%this.total;
    let lo=0,hi=n-1;
    while(lo<hi){ const mid=(lo+hi+1)>>1; if(this.cum[mid]<=s) lo=mid; else hi=mid-1; }
    const i=lo, t=(s-this.cum[i])/Math.max(1e-6,this.cum[i+1]-this.cum[i]);
    const a=this.pts[i], b=this.pts[(i+1)%n];
    out.x=a.x+(b.x-a.x)*t; out.z=a.z+(b.z-a.z)*t; return out;
  }
}
function clampPosition(p){
  p.x=clamp(p.x,-BOUND.x,BOUND.x);
  p.z=clamp(p.z,-BOUND.z,BOUND.z);
  if(p.y<GROUND-PIT.depth-0.2) p.y=GROUND-PIT.depth-0.2;
  if(p.y>40) p.y=40;
}

// ENVIRONMENT — 室内房间 + 桌面 + 桌面道具 + 实体旋钮
// ========================================
function woodTexture(){
  const c=makeCanvas(1024,640), x=c.getContext('2d');
  x.fillStyle='#463122'; x.fillRect(0,0,1024,640);
  for(let i=0;i<130;i++){
    const y0=srand()*640, dark=srand()>0.5;
    x.strokeStyle=dark?`rgba(30,20,12,${0.05+srand()*0.1})`:`rgba(120,86,52,${0.04+srand()*0.08})`;
    x.lineWidth=0.6+srand()*2.2;
    x.beginPath(); x.moveTo(-10,y0);
    for(let px=0;px<=1034;px+=64) x.lineTo(px, y0+Math.sin(px*0.008+i)*6+(srand()-0.5)*7);
    x.stroke();
  }
  for(let i=0;i<7;i++){ // 木节
    const kx=srand()*1024, ky=srand()*640;
    for(let r=2;r<16;r+=3){ x.strokeStyle=`rgba(25,16,9,${0.12-r*0.005})`; x.lineWidth=1.4;
      x.beginPath(); x.ellipse(kx,ky,r*1.7,r,r*0.4,0,TAU); x.stroke(); }
  }
  for(let i=0;i<2400;i++){ x.fillStyle=`rgba(0,0,0,${srand()*0.05})`; x.fillRect(srand()*1024,srand()*640,2,2); }
  return ctex(c);
}
function buildEnvironment(){

  desk.position.y=-DESK.h/2; desk.receiveShadow=true; desk.castShadow=true; scene.add(desk);
  const edge = new THREE.Mesh(new THREE.BoxGeometry(DESK.w+0.5,0.14,DESK.d+0.5), std(0x2e2013,.75));

  const legG=new THREE.BoxGeometry(2.2,7.4,2.2);
  const legMat=std(0x33241a,.82);
  [[-34,-19],[34,-19],[-34,19],[34,19]].forEach(p=>{
    const leg=new THREE.Mesh(legG,legMat); leg.castShadow=true;
    leg.position.set(p[0],-DESK.h-3.7,p[1]); scene.add(leg);
  });

  buildDeskProps();
  buildConsole();
}
function buildDeskProps(){
  // 蓝图 ×2
  const bp1=makeCanvas(512,360); {
    const x=bp1.getContext('2d');
    x.fillStyle='#dfe9f1'; x.fillRect(0,0,512,360);
    x.strokeStyle='#b7cddd'; x.lineWidth=1;
    for(let i=0;i<512;i+=24){x.beginPath();x.moveTo(i,0);x.lineTo(i,360);x.stroke();}
    for(let i=0;i<360;i+=24){x.beginPath();x.moveTo(0,i);x.lineTo(512,i);x.stroke();}
    x.strokeStyle='#3f6a99'; x.lineWidth=3; x.strokeRect(70,60,300,210);
    x.lineWidth=1.5; x.strokeRect(80,70,280,190);
    x.beginPath();x.moveTo(80,160);x.lineTo(360,160);x.moveTo(200,70);x.lineTo(200,260);x.stroke();
    x.beginPath();x.moveTo(280,160);x.lineTo(280,260);x.stroke();
    x.beginPath();x.arc(120,210,18,0,Math.PI);x.stroke();

function knobValue(i){
  const n = i===0?ST.speedPresets.length : i===1?ST.timePresets.length : ST.dustPresets.length;
  const cur = i===0?ST.speedIdx : i===1?ST.timeIdx : ST.dustIdx;
  return cur/(n-1);
}
function setKnobValue(i,t){
  const n = i===0?ST.speedPresets.length : i===1?ST.timePresets.length : ST.dustPresets.length;
  const idx = clamp(Math.round(t*(n-1)),0,n-1);
  if(i===0) ST.speedIdx=idx; else if(i===1) ST.timeIdx=idx; else ST.dustIdx=idx;
  updateKnobs();
}
function updateKnobs(){
  for(let i=0;i<3;i++){
    const t=knobValue(i), k=KNOBS[i];
    k.knob.rotation.y = lerp(2.35,-2.35,t);
    const n = i===0?ST.speedPresets.length : i===1?ST.timePresets.length : ST.dustPresets.length;
    const idx = i===0?ST.speedIdx : i===1?ST.timeIdx : ST.dustIdx;
    knobLEDs[i].forEach((led,li)=>{ led.material = li<=idx ? M.ledOn : M.ledOff; });
  }
}

const slabTopY = k => GROUND+0.5+(k-1)*BLD.fh+0.22;   // 第 k 层楼板顶
function buildBuilding(){
  const x0=BLD.cx-BLD.w/2, x1=BLD.cx+BLD.w/2, z0=BLD.cz-BLD.d/2, z1=BLD.cz+BLD.d/2;
  // 基础
  P.concDark.add(BLD.cx,GROUND+0.25,BLD.cz, BLD.w+0.8,0.5,BLD.d+0.8);
  P.cement.add(BLD.cx,GROUND+0.52,BLD.cz, BLD.w+0.4,0.1,BLD.d+0.4);
  const colH=BLD.fh-0.22;
  const colXs=[-3.9,-1.3,1.3,3.9], colZs=[-2.5,0,2.5];
  function wallRun(ax, az, bx2, bz2, k, n=6, winW=1.0){
    // 沿 (ax,az)->(bx2,bz2) 生成一堵带窗墙（墩+上下带+玻璃）
    const len=Math.hypot(bx2-ax,bz2-az);
    const wallT=0.24, cxm=(ax+bx2)/2, czm=(az+bz2)/2;
    const ry=Math.atan2(-(bz2-az), bx2-ax);
    const sy=slabTopY(k);
    P.concrete.add(cxm,sy+0.16,czm, len,0.32,wallT, ry);
    P.concrete.add(cxm,sy+colH-0.16,czm, len,0.32,wallT, ry);
    for(let i=0;i<=n;i++){ const t=i/n;
      P.concrete.add(ax+(bx2-ax)*t, sy+colH/2, az+(bz2-az)*t, 0.62,colH-0.64,wallT, ry); }
    for(let i=0;i<n;i++){ const t=(i+0.5)/n;
      P.glass.add(ax+(bx2-ax)*t, sy+colH/2, az+(bz2-az)*t, winW,colH-0.7,0.3, ry); }
  }
  for(let k=1;k<=10;k++){
    const sy=slabTopY(k)-0.22;
    const fresh = k>=9; // 顶层新浇
    P[fresh?'cement':'concrete'].add(BLD.cx,sy+0.11,BLD.cz, BLD.w+0.3,0.22,BLD.d+0.3);
    if(k<10) colXs.forEach(lx=>colZs.forEach(lz=>{
      P.concrete.add(BLD.cx+lx,sy+0.22+colH/2,BLD.cz+lz, 0.4,colH,0.4);
    }));
    if(k<=7){
      wallRun(x0+0.12,z1-0.12, x1-0.12,z1-0.12, k); // 前
      wallRun(x0+0.12,z0+0.12, x1-0.12,z0+0.12, k); // 后
      wallRun(x0+0.12,z0+0.12, x0+0.12,z1-0.12, k, 3, 0.9); // 左
      wallRun(x1-0.12,z0+0.12, x1-0.12,z1-0.12, k, 3, 0.9); // 右
    } else if(k===8){
      wallRun(x0+0.12,z1-0.12, BLD.cx+1,z1-0.12, k);   // 前墙半幅
      wallRun(x1-0.12,z0+0.12, x1-0.12,z1-0.12, k, 3, 0.9);  // 右墙
    }
    if(k>=9){ // 楼板边缘模板 + 预留钢筋
      P.plank.add(BLD.cx,sy+0.3,BLD.cz-0.5, BLD.w,0.5,0.06);
      P.plank.add(BLD.cx,sy+0.3,BLD.cz+0.5, BLD.w,0.5,0.06);
    }
  }
  // 顶部插筋
  const topY=slabTopY(10);
  colXs.forEach(lx=>colZs.forEach(lz=>{
    for(let r=0;r<2;r++) P.rod.add(BLD.cx+lx+(r?-0.1:0.1), topY+0.5, BLD.cz+lz, 0.05,0.9,0.05);
  }));
  for(let i=0;i<10;i++) P.rod.add(x0+0.5+srand()*(BLD.w-1), topY+0.45, z0+0.4+srand()*(BLD.d-0.8), 0.045,0.8,0.045, srand()*0.4-0.2);
  // 顶层砖堆 / 砂浆桶
  P.brick.add(2.6,topY+0.18,z0+0.7, 1.1,0.35,0.7);
  P.brick.add(3.0,topY+0.5,z0+0.75, 0.8,0.3,0.55, 0,0.1);
  P.red.add(8.4,topY+0.22,0.6, 0.7,0.44,0.7);
  // 核心筒（爬升模板）
  const coreH=16.7-(GROUND+0.5);
  P.concrete.add(2.9,GROUND+0.5+coreH/2,-3.5, 2.9,coreH,2.9);
  for(let b=0;b<11;b++) P.concDark.add(2.9,GROUND+1.2+b*1.35,-3.5, 3.02,0.1,3.02);
  P.yellow.add(2.9,16.85,-3.5, 3.1,0.16,3.1); // 作业层
  P.beacon.add(2.9,17.05,-3.5, 0.12,0.16,0.12);
  // 脚手架（前 + 东）
  function scaffoldRun(ax,az,bx2,bz2,hMax){
    const len=Math.hypot(bx2-ax,bz2-az), n=Math.max(2,Math.round(len/1.7));
    const ry=Math.atan2(-(bz2-az), bx2-ax);
    for(let i=0;i<=n;i++){ const t=i/n, px=ax+(bx2-ax)*t, pz=az+(bz2-az)*t;
      P.pole.add(px,GROUND+hMax/2,pz, .09,hMax,.09);
    }
    const m=Math.round(n/2);
    for(let lv=1;lv<=Math.floor(hMax/1.35);lv++){
      const y=GROUND+lv*1.35;
      P.pole.add((ax+bx2)/2,y,(az+bz2)/2, len,.07,.07, ry);
      if(lv%2===0) P.plank.add((ax+bx2)/2,y+0.05,(az+bz2)/2, len*0.94,.06,0.7, ry);
    }
    for(let i=1;i<m;i++){ const t=i/m;
      P.pole.add(ax+(bx2-ax)*t,GROUND+hMax/2,az+(bz2-az)*t, .07,hMax,.07); }
  }
  scaffoldRun(x0-0.4,1.85, x1+0.4,1.85, 11.2);
  scaffoldRun(10.2,z0-0.3, 10.2,z1+0.3, 11.2);
  // 施工升降机（动笼）
  const mastX=11.5;
  for(const dz of [-0.35,0.35]) for(const dx of [-0.22,0.22])
    P.yellow.add(mastX+dx,GROUND+6.4,z0+0.9+dz, .09,12.8,.09);
  for(let lv=0;lv<9;lv++){ P.yellow.add(mastX,GROUND+1.5+lv*1.4,z0+0.9, .6,.08,.8); }
  const cage=new THREE.Group(); scene.add(cage);
  bx(M.yellow,1.1,1.15,1.0,0,0.62,0,cage);
  bx(M.black,0.9,0.85,0.06,0,0.62,0.5,cage);
  bx(M.black,0.06,0.85,0.9,0.55,0.62,0,cage);
  DYN.push((dt,t)=>{ const y=GROUND+1.0+ (Math.sin(t*0.24)*0.5+0.5)*9.5; cage.position.set(mastX,y,z0+0.9); });
  // 楼层标牌横幅
  const ban=makeCanvas(512,64); { const x=ban.getContext('2d');
    x.fillStyle='#14538f'; x.fillRect(0,0,512,64); x.fillStyle='#fff';
    x.font='bold 34px sans-serif'; x.textAlign='center'; x.fillText('安 全 生 产 · 质 量 第 一',256,44); }
  const banner=new THREE.Mesh(new THREE.PlaneGeometry(7,0.85), new THREE.MeshStandardMaterial({map:ctex(ban),roughness:.8}));
  banner.position.set(BLD.cx,10.4,z1+1.95); scene.add(banner);
  const banner2=banner.clone(); banner2.rotation.y=Math.PI; banner2.position.z=z1+1.9; scene.add(banner2);
}

function makeMound(cx,cz,w,d,h,pool,base,baseY){
  const step=0.42, y0=baseY??(GROUND+0.2);
  for(let gx=-w/2; gx<=w/2; gx+=step) for(let gz=-d/2; gz<=d/2; gz+=step){
    const r=Math.hypot(gx/(w/2), gz/(d/2));
    if(r>1) continue;
    const hh=h*(1-r*r)*(0.75+srand()*0.5);
    for(let y=0; y<hh; y+=step){
      if(srand()<0.12 && y>hh-step*1.5) continue;
      const c=new THREE.Color(base).offsetHSL(0,(srand()-0.5)*0.06,(srand()-0.5)*0.1);
      pool.add(cx+gx+(srand()-0.5)*0.08, y0+y, cz+gz+(srand()-0.5)*0.08,
        step*(0.9+srand()*0.2), step, step*(0.9+srand()*0.2), srand()*0.4, 0,0, c.getHex());
    }
  }
}

function buildFlags(){
  const geo=new THREE.PlaneGeometry(0.62,0.4,4,2); geo.translate(0.31,0,0);

    side:THREE.DoubleSide,
    uniforms:{uTime:{value:0}},
    vertexShader:`
      attribute vec3 aCol; attribute float aPhase;
      uniform float uTime; varying vec3 vCol;
      void main(){
        vec3 p=position;
        float w=uv.x;
        p.z += sin(uTime*5.0+aPhase+w*4.5)*0.1*w;
        p.y += sin(uTime*5.0+aPhase)*0.02;
        vCol = aCol*(0.82+0.18*sin(w*3.0+aPhase));
        gl_Position = projectionMatrix*modelViewMatrix*instanceMatrix*vec4(p,1.0);
      }`,
    fragmentShader:`varying vec3 vCol; void main(){ gl_FragColor=vec4(vCol,1.0); }`
  });
  const N=12;
  const im=new THREE.InstancedMesh(geo,flagMat,N);
  const cols=[0xd8402f,0xf2c231,0x2e6cb5,0x3fae5a];
  const d=new THREE.Object3D(), col=new THREE.Color();
  const aCol=new Float32Array(N*3), aPhase=new Float32Array(N);

function buildCrane(cfg, tasks, loadKinds){
  const g=new THREE.Group(); g.position.set(cfg.x,GROUND,cfg.z); scene.add(g);

  for(const dx of [-0.45,0.45]) for(const dz of [-0.45,0.45]) bx(M.yellow,.1,H,.1,dx,H/2+0.6,dz,g);
  for(let y=0.6;y<H+0.5;y+=cell){
    const s=(Math.round((y-0.6)/cell)%2? 0.72:-0.72);
    bx(M.yellow,1.0,.07,.07,0,y+cell/2,-0.45,g);
    bx(M.yellow,1.0,.07,.07,0,y+cell/2,0.45,g);
    bx(M.yellow,.07,.07,1.0,-0.45,y+cell/2,0,g);
    bx(M.yellow,.07,.07,1.0,0.45,y+cell/2,0,g);
    bxr(M.yellow,1.25,.055,.055,0,y+cell/2,-0.45,g,0,0,s);
    bxr(M.yellow,1.25,.055,.055,0,y+cell/2,0.45,g,0,0,-s);
  }
  const slewY=H+0.6;
  const slew=new THREE.Group(); slew.position.y=slewY; g.add(slew);
  bx(M.yellow,.6,1.0,.6,0,0.5,0,slew);                       // 塔帽
  bx(M.yellow,.62,.62,.7,0,-0.62,-0.78,slew);                // 驾驶室
  bx(M.cabGlass,.5,.4,.06,0,-0.66,-0.41,slew);
  bx(M.beacon,.1,.12,.1,0,-0.26,-0.78,slew);
  const jibL=cfg.jib, cbL=4.4;
  bx(M.yellow,jibL,.09,.09, 0.5+jibL/2,0.15,-0.4,slew);
  bx(M.yellow,jibL,.09,.09, 0.5+jibL/2,0.15,0.4,slew);
  bx(M.yellow,jibL,.09,.09, 0.5+jibL/2,0.85,0,slew);
  for(let x=0;x<jibL-0.4;x+=1.05){
    const s=(Math.round(x/1.05)%2?0.62:-0.62);
    bxr(M.yellow,1.12,.05,.05, 1.05+x,0.5,-0.4,slew,0,0,s);
    bxr(M.yellow,1.12,.05,.05, 1.05+x,0.5,0.4,slew,0,0,-s);
    bxr(M.yellow,.9,.05,.05, 1.05+x,0.5,0,slew,0.62,0,0);
  }
  bx(M.yellow,cbL,.09,.09, -cbL/2-0.35,0.15,-0.4,slew);
  bx(M.yellow,cbL,.09,.09, -cbL/2-0.35,0.15,0.4,slew);
  bx(M.yellow,cbL,.09,.09, -cbL/2-0.35,0.62,0,slew);
  bx(M.concDark,.7,1.05,1.5,-cbL+0.25,-0.3,0,slew);
  bx(M.concDark,.45,.85,1.3,-cbL+0.95,-0.22,0,slew);
  cy(M.steelDark,.2,1.1,-1.7,0.1,0,slew,'x');
  cy(M.steelDark,.12,0.9,-2.5,0.1,0,slew,'x');
  bx(M.steelDark,.5,.7,.6,-3.4,0.35,0,slew);
  // 拉杆
  const pend=(x1,y1,x2,y2)=>{
    const l=Math.hypot(x2-x1,y2-y1), a=Math.atan2(y2-y1,x2-x1);
    for(const dz of [-0.3,0.3]) bxr(M.steelDark,l,.035,.035,(x1+x2)/2,(y1+y2)/2,dz,slew,0,0,a);
  };
  pend(0.1,1.15, 0.5+jibL*0.62,0.9);
  pend(0.1,1.15, -cbL*0.62,0.66);
  bx(M.beacon,.13,.13,.13, 0.5+jibL-0.25,1.02,0,slew);
  bx(M.beacon,.12,.12,.12, 0,1.08,0,slew);
  // 小车 / 钢丝绳 / 吊钩
  const trolley=new THREE.Group(); slew.add(trolley);
  bx(M.orange,.42,.14,.5,0,-0.08,0,trolley);
  bx(M.steelDark,.52,.08,.6,0,-0.17,0,trolley);
  const cable=new THREE.Mesh(G.cable,M.black); cable.position.y=-0.16; cable.castShadow=false; trolley.add(cable);
  const hookG=new THREE.Group(); trolley.add(hookG);
  bx(M.steelDark,.16,.26,.16,0,0,0,hookG);
  bx(M.black,.09,.13,.09,0,-0.19,0,hookG);
  const loadG=new THREE.Group(); loadG.position.y=-0.42; hookG.add(loadG);
  // 吊物
  const loads={};
  loadKinds.forEach(kind=>{
    const lg=new THREE.Group(); lg.visible=false; loadG.add(lg); loads[kind]=lg;
    if(kind==='rebar'){
      for(let i=0;i<8;i++) cy(M.rust,.045,3.2,0,0.05,-0.32+i*0.09,lg,'x');
      bx(M.steelDark,.12,.1,.8,-1.1,0.05,0,lg); bx(M.steelDark,.12,.1,.8,1.1,0.05,0,lg);
    } else if(kind==='skip'){

      for(let i=0;i<6;i++) cy(M.steel,.09,3.0,0,0.09+i*0.2,-0.3+i*0.05,lg,'x');
    }
  });
  // 任务序列
  const slewWY=GROUND+slewY;
  const lenFor=ty=>slewWY-0.8-ty;

  const lim=cfg.yawLim;
  const mk=(t,isPick)=>{
    const x=isPick?t.px:t.dx, z=isPick?t.pz:t.dz, y=isPick?t.py:t.dy;
    let φ=Math.atan2(z-cfg.z,x-cfg.x);
    if(lim<10) φ=clamp(φ,-lim,lim);
    return {φ, r:clamp(Math.hypot(x-cfg.x,z-cfg.z),cfg.trolleyMin,cfg.trolleyMax), len:lenFor(y)};
  };
  const seq=[];
  tasks.forEach((t,ti)=>{
    const p=mk(t,true), d=mk(t,false);
    seq.push({do:'slew', φ:p.φ, r:p.r});
    seq.push({do:'cable', len:p.len});
    seq.push({do:'grab', dur:1.0, load:t.load});
    seq.push({do:'cable', len:cruise});
    seq.push({do:'slew', φ:d.φ, r:d.r});
    seq.push({do:'cable', len:d.len});
    seq.push({do:'drop', dur:1.0, load:t.load, dust:1});
    seq.push({do:'cable', len:cruise});
  });
  const cr={g,slew,trolley,cable,hookG,loadG,loads,seq,i:0,pt:0,φ:0,r:3,len:4,vel:0,prevφ:0,tilt:0,cfg};
  initCraneItem(cr);
  CRANES.push(cr);
  return cr;
}
function initCraneItem(cr){
  const it=cr.seq[cr.i];
  if(it.do==='slew'){
    it.φ0=cr.φ; it.r0=cr.r;
    if(cr.cfg.yawLim<10){
      let tgt=it.φ;
      while(tgt-it.φ0>Math.PI) tgt-=TAU;
      while(tgt-it.φ0<-Math.PI) tgt+=TAU;
      it.φ=clamp(tgt,-cr.cfg.yawLim,cr.cfg.yawLim);
    } else {
      let d=it.φ-it.φ0;
      while(d>Math.PI) d-=TAU; while(d<-Math.PI) d+=TAU;
      it.φ=it.φ0+d;
    }
    it.dur=Math.abs(it.φ-it.φ0)/0.30+0.5;
  } else if(it.do==='cable'){
    it.l0=cr.len;
    if(it.r===undefined) it.r=cr.r;
    it.dur=Math.abs(it.len-it.l0)/2.4+0.35;
  } else { it.dur=it.dur||1; it.fired=false; }
}
function updateCranes(dt){
  for(const cr of CRANES){
    cr.pt+=dt*speedMult();
    const it=cr.seq[cr.i], k=ease(clamp01(cr.pt/it.dur));
    if(it.do==='slew'){
      cr.φ=lerp(it.φ0,it.φ,k); cr.r=lerp(it.r0,it.r,k);
      cr.slew.rotation.y=-cr.φ;
      cr.trolley.position.x=cr.r;
      cr.vel=(cr.φ-cr.prevφ)/Math.max(dt,1e-4); cr.prevφ=cr.φ;
    } else if(it.do==='cable'){
      cr.len=lerp(it.l0,it.len,k);
      cr.r=lerp(cr.r,it.r,Math.min(1,dt*1.5));
      cr.trolley.position.x=cr.r;
      cr.vel*=0.9;
    } else {
      cr.vel*=0.9;
      if(!it.fired && cr.pt>=it.dur*0.5){
        it.fired=true;
        Object.values(cr.loads).forEach(l=>l.visible=false);
        if(it.do==='grab'){ cr.loads[it.load].visible=true; }
        if(it.do==='drop'){
          cr.hookG.getWorldPosition(tmpV);
          spawnBurst(tmpV.x,tmpV.y-0.4,tmpV.z,10,0.3);
        }
      }
    }
    cr.cable.scale.y=Math.max(0.3,cr.len);
    cr.hookG.position.y=-0.16-cr.len;
    cr.tilt+=((clamp(-cr.vel*0.18,-0.09,0.09))-cr.tilt)*Math.min(1,dt*4);
    cr.hookG.rotation.x=cr.tilt;
    if(cr.pt>=it.dur){ cr.i=(cr.i+1)%cr.seq.length; cr.pt=0; initCraneItem(cr); }
  }
}

function updateVehicles(dt){
  const ahead={x:0,z:0};
  for(const v of VEHICLES){
    const fol=v.fol;
    if(v.dwell>0){
      v.dwell-=dt; v.actT+=dt;
      if(v.kind==='truck'&&v.act==='dump') truckDump(v,dt);
      if(v.kind==='mixer') mixerPour(v);
      if(v.kind==='loader') loaderWork(v);
    } else {
      let target=v.baseSpeed*speedMult();
      fol.posAt(fol.s+2.0,ahead);
      for(const o of VEHICLES){
        if(o===v) continue;
        const dx=o.g.position.x-ahead.x, dz=o.g.position.z-ahead.z;
        if(dx*dx+dz*dz<2.1*2.1){ target=0; break; }
      }
      v.v+=clamp(target-v.v,-dt*7,dt*2.4);
      const ds=v.v*dt;
      const nx=fol.s+ds;
      const st=fol.stops[fol.stopIdx];
      if(st && fol.s<st.s && nx>=st.s){
        fol.s=st.s; v.dwell=st.dur; v.actT=0; v.act=st.act; v.v=0;
        fol.stopIdx=(fol.stopIdx+1)%Math.max(1,fol.stops.length);
      } else fol.s=nx;
    }
    // 摆放
    const p=fol.posAt(fol.s,TMP1), h1=fol.posAt(fol.s-0.5,TMP2), h2=fol.posAt(fol.s+0.5,TMP3);
    v.g.position.set(p.x,GROUND,p.z);
    const yaw=Math.atan2(-(h2.z-h1.z),h2.x-h1.x);
    let dy=yaw-v.g.rotation.y;
    while(dy>Math.PI)dy-=TAU; while(dy<-Math.PI)dy+=TAU;
    v.g.rotation.y+=dy*Math.min(1,dt*8);
    clampPosition(v.g.position);
    v.spin+=v.v*dt/0.24;
    v.wheels.forEach(w=>w.rotation.z=-v.spin);
    if(v.drum) v.drum.rotation.y+=dt*2.3*speedMult();
  }
}
function truckDump(v,dt){
  const T=v.actT, D=6, k=T/D;
  let tilt=0;
  if(k<0.22) tilt=ease(k/0.22);
  else if(k<0.72) tilt=1;
  else tilt=1-ease((k-0.72)/0.28);
  v.bed.rotation.z=tilt*0.85;
  if(k>0.2&&k<0.75&&Math.random()<0.5){
    v.rearMk.getWorldPosition(tmpV);
    spawnBurst(tmpV.x,tmpV.y-0.1,tmpV.z,3,0.55);
  }
  if(v.dwell<=0) v.bed.rotation.z=0;
}
function mixerPour(v){
  const target=(v.actT>1.2&&v.dwell>2.5)?1.15:0.35;
  v.chute.rotation.z+=((target)-v.chute.rotation.z)*0.06;
}
function loaderWork(v){
  const T=v.actT, D=5, k=T/D;
  const arms=v.arms, bk=v.bucket;
  let aT,bT;
  if(v.act==='scoopL'){
    if(k<0.3){ aT=lerp(0.5,-0.3,ease(k/0.3)); bT=-0.45; }
    else if(k<0.62){ const kk=ease((k-0.3)/0.32); aT=-0.3; bT=lerp(-0.45,0.65,kk);
      if(Math.random()<0.3){ v.g.getWorldPosition(tmpV); spawnBurst(tmpV.x+1.4,tmpV.y+0.2,tmpV.z,2,0.4); } }
    else { const kk=ease((k-0.62)/0.38); aT=lerp(-0.3,0.55,kk); bT=0.35; }
  } else { // dumpL
    if(k<0.3){ aT=lerp(0.2,0.6,ease(k/0.3)); bT=0.3; }
    else if(k<0.6){ const kk=ease((k-0.3)/0.3); aT=0.6; bT=lerp(0.3,-0.7,kk);
      if(Math.random()<0.35){ v.g.getWorldPosition(tmpV); spawnBurst(tmpV.x+1.3,tmpV.y+0.35,tmpV.z,2,0.5); } }
    else { const kk=ease((k-0.6)/0.4); aT=lerp(0.6,0.05,kk); bT=lerp(-0.7,-0.1,kk); }
  }
  arms.rotation.z=aT; bucket.rotation.z=bT;
  if(v.dwell<=0){ v.arms.rotation.z=0.05; v.bucket.rotation.z=-0.1; }
}

const _q=new THREE.Quaternion(), _qy=new THREE.Quaternion(), _qx=new THREE.Quaternion(), _qz=new THREE.Quaternion();
const _m=new THREE.Matrix4(), _p=new THREE.Vector3(), _s=new THREE.Vector3(), _c=new THREE.Vector3();
const _AX=new THREE.Vector3(1,0,0), _AY=new THREE.Vector3(0,1,0), _AZ=new THREE.Vector3(0,0,1);
function writeLimb(mesh,idx,x,y,z,yaw,jx,jy,jz,rx,rz,len,sx,sz){
  _qy.setFromAxisAngle(_AY,yaw); _qx.setFromAxisAngle(_AX,rx); _qz.setFromAxisAngle(_AZ,rz);
  _q.copy(_qy).multiply(_qx).multiply(_qz);
  _p.set(jx,jy,jz).applyQuaternion(_qy);
  _p.x+=x; _p.y+=y; _p.z+=z;
  _c.set(0,-len/2,0).applyQuaternion(_q);
  _p.add(_c);
  _s.set(sx,len,sz);
  _m.compose(_p,_q,_s);
  mesh.setMatrixAt(idx,_m);
}
function updateWorkers(dt,t){
  const MESH=WORKER_M; if(!MESH) return;
  const sm=speedMult();
  for(let i=0;i<WORKERS.length;i++){
    const w=WORKERS[i];
    let x=w.px,z=w.pz,yaw=w.face,bob=0,legA=0,armA=0,bend=0,armRx=0,armRz=0,idleSway=0;
    if(w.mode==='walk'&&w.fol){
      w.fol.advance(w.speed*sm*dt);
      const p=w.fol.posAt(w.fol.s,TMP1), h1=w.fol.posAt(w.fol.s-0.4,TMP2), h2=w.fol.posAt(w.fol.s+0.4,TMP3);
      x=p.x; z=p.z;
      yaw=Math.atan2(-(h2.z-h1.z),h2.x-h1.x);
      w.ph+=w.speed*sm*dt*5.2;
      legA=Math.sin(w.ph)*0.72; armA=-Math.sin(w.ph)*0.55;
      bob=Math.abs(Math.sin(w.ph))*0.035;
      w.x=x; w.z=z;
    } else {
      x=w.x||w.px; z=w.z||w.pz;
      const t2=t*1.3+w.ph;
      if(w.mode==='bend'){ bend=0.5*(0.5+0.5*Math.sin(t2*1.3)); armRx=-1.05-bend*0.6; }
      else if(w.mode==='hammer'){ bend=0.22; armRx=-2.2+1.5*Math.max(0,Math.sin(t2*2.8)); idleSway=0.03*Math.sin(t2); }
      else if(w.mode==='signal'){ armRx=-2.5; armRz=Math.sin(t2*5.5)*0.5; }
      else { idleSway=0.045*Math.sin(t2*0.9); }
    }
    const y=w.y+bob;
    // 腿
    writeLimb(MESH.legs,i*2,  x,y,z,yaw, 0,0.32,0.09,  legA,0,      0.32,0.09,0.09);
    writeLimb(MESH.legs,i*2+1,x,y,z,yaw, 0,0.32,-0.09, -legA,0,     0.32,0.09,0.09);
    // 臂（右手带动作）
    writeLimb(MESH.arms,i*2,  x,y,z,yaw, 0,0.58,0.16,  armA, 0, 0.26,0.07,0.07);
    writeLimb(MESH.arms,i*2+1,x,y,z,yaw, 0,0.58,-0.16, (w.mode==='walk'?-armA:armRx), armRz, 0.26,0.07,0.07);
    // 身体（弯腰）
    writeLimb(MESH.body,i, x,y,z,yaw, 0,0.30,0, bend,idleSway, 0.32,0.26,0.15);
    // 头 + 安全帽
    writeLimb(MESH.head,i, x,y,z,yaw, 0,0.72,0, 0,0, 0.14,0.13,0.13);
    writeLimb(MESH.helm,i, x,y,z,yaw, 0,0.815,0, 0,0, 0.075,0.175,0.175);
  }
  MESH.legs.instanceMatrix.needsUpdate=true;
  MESH.arms.instanceMatrix.needsUpdate=true;
  MESH.body.instanceMatrix.needsUpdate=true;
  MESH.head.instanceMatrix.needsUpdate=true;
  MESH.helm.instanceMatrix.needsUpdate=true;
}

// ========================================
function makeDust(){
  const N=700;
  const pos=new Float32Array(N*3), seed=new Float32Array(N), size=new Float32Array(N);
  const zones=[[-22,15.9,-2,7],[-9.4,0.4,-16,-10],[-13,13,-8,8],[15.4,22.4,-8,4],[6.5,11.5,8,16]];
  for(let i=0;i<N;i++){
    const z0=zones[(srand()*zones.length)|0];
    pos[i*3]=lerp(z0[0],z0[1],srand());
    pos[i*3+1]=srand()*4.2;
    pos[i*3+2]=lerp(z0[2],z0[3],srand());
    seed[i]=srand()*100; size[i]=5+srand()*11;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
  geo.setAttribute('aSize',new THREE.BufferAttribute(size,1));
  const mat=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false,
    uniforms:{uTime:{value:0},uIntensity:{value:1},uPR:{value:Math.min(devicePixelRatio,2)}},
    vertexShader:`
      attribute float aSeed; attribute float aSize;
      uniform float uTime; uniform float uPR; varying float vA;
      void main(){
        vec3 p=position;
        p.y=1.1+mod(p.y+uTime*(0.22+fract(aSeed*0.37)*0.4), 4.2);
        p.x+=sin(uTime*0.4+aSeed)*0.55;
        p.z+=cos(uTime*0.31+aSeed*1.3)*0.55;
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        vA=sin(3.14159*clamp((p.y-1.1)/4.2,0.0,1.0));
        gl_PointSize=aSize*uPR*(6.0/max(1.0,-mv.z));
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      uniform float uIntensity; varying float vA;
      void main(){
        vec2 d=gl_PointCoord-0.5; float r=length(d);
        float a=smoothstep(0.5,0.1,r)*vA*0.26*uIntensity;
        if(a<0.012) discard;
        gl_FragColor=vec4(0.63,0.54,0.42,a);
      }`
  });
  const pts=new THREE.Points(geo,mat); pts.frustumCulled=false; scene.add(pts);
  return {mat,pts};
}
function makeRain(){
  const N=1500;
  const pos=new Float32Array(N*3), seed=new Float32Array(N), size=new Float32Array(N);
  for(let i=0;i<N;i++){
    pos[i*3]=(srand()*2-1)*27;
    pos[i*3+1]=srand()*26.0;
    pos[i*3+2]=(srand()*2-1)*19;
    seed[i]=srand()*100; size[i]=1.15+srand()*1.6;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
  geo.setAttribute('aSize',new THREE.BufferAttribute(size,1));
  const mat=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false,
    uniforms:{uTime:{value:0},uRain:{value:0},uPR:{value:Math.min(devicePixelRatio,2)}},
    vertexShader:`
      attribute float aSeed; attribute float aSize;
      uniform float uTime; uniform float uPR; varying float vA;
      void main(){
        vec3 p=position;
        p.y=1.0+mod(p.y-uTime*(17.0+fract(aSeed*0.53)*11.0), 26.0);
        p.x+=p.y*0.05;
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        vA=0.55+0.45*fract(aSeed*0.71);
        gl_PointSize=aSize*uPR*(12.5/max(1.0,-mv.z));
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      uniform float uRain; varying float vA;
      void main(){
        vec2 d=gl_PointCoord-0.5;
        float a=smoothstep(0.5,0.0,abs(d.x)*2.6)*smoothstep(0.5,0.1,abs(d.y)*1.7)*vA*0.68*uRain;
        if(a<0.01) discard;
        gl_FragColor=vec4(0.72,0.8,0.92,a);
      }`
  });
  const pts=new THREE.Points(geo,mat); pts.frustumCulled=false; pts.visible=false; scene.add(pts);
  return {mat,pts};
}
function makeBurst(){
  const N=240;
  const pos=new Float32Array(N*3), life=new Float32Array(N);
  const vel=new Float32Array(N*3), maxL=new Float32Array(N);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aLife',new THREE.BufferAttribute(life,1));
  const mat=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false,
    uniforms:{uPR:{value:Math.min(devicePixelRatio,2)}},
    vertexShader:`
      attribute float aLife; varying float vL; uniform float uPR;
      void main(){
        vL=aLife;
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_PointSize=(2.0+aLife*7.0)*uPR*(6.0/max(1.0,-mv.z));
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      varying float vL;
      void main(){
        vec2 d=gl_PointCoord-0.5;
        float a=smoothstep(0.5,0.1,length(d))*vL*0.5;
        if(a<0.01) discard;
        gl_FragColor=vec4(0.58,0.48,0.36,a);
      }`
  });
  const pts=new THREE.Points(geo,mat); pts.frustumCulled=false; scene.add(pts);
  let cursor=0;
  return {
    spawn(x,y,z,n,spread){
      for(let k=0;k<n;k++){
        const i=cursor=(cursor+1)%N;
        pos[i*3]=x+(Math.random()-0.5)*0.3;
        pos[i*3+1]=y+Math.random()*0.2;
        pos[i*3+2]=z+(Math.random()-0.5)*0.3;
        vel[i*3]=(Math.random()-0.5)*spread*2.2;
        vel[i*3+1]=Math.random()*spread*2.4+0.6;
        vel[i*3+2]=(Math.random()-0.5)*spread*2.2;
        maxL[i]=0.7+Math.random()*0.7; life[i]=1;
      }
      geo.attributes.position.needsUpdate=true;
    },
    update(dt){
      let any=false;
      for(let i=0;i<N;i++){
        if(life[i]<=0) continue;
        any=true;
        life[i]-=dt/maxL[i];
        vel[i*3+1]-=dt*4.5;
        pos[i*3]+=vel[i*3]*dt; pos[i*3+1]+=vel[i*3+1]*dt; pos[i*3+2]+=vel[i*3+2]*dt;
        if(life[i]<0) life[i]=0;
      }
      if(any){ geo.attributes.position.needsUpdate=true; geo.attributes.aLife.needsUpdate=true; }
    }
  };
}
function spawnBurst(x,y,z,n,spread){ if(burst) burst.spawn(x,y,z,n,spread); }

const _colA=new THREE.Color(), _colB=new THREE.Color(), _sky=new THREE.Color(), _gray=new THREE.Color(0x3a4048);
function updateWeatherDay(dt){
  ST.rain+=((ST.rainOn?1:0)-ST.rain)*Math.min(1,dt*0.8);
  ST.wet+=((ST.rainOn?1:0)-ST.wet)*Math.min(1,dt*0.16);
  ST.time=(ST.time+dt*ST.timeBase*timeMult())%24;
  const t=ST.time;
  let i=0;
  while(i<SKY_KEYS.length-2 && SKY_KEYS[i+1].t<t) i++;
  const a=SKY_KEYS[i], b=SKY_KEYS[i+1], k=clamp01((t-a.t)/Math.max(0.001,b.t-a.t));
  _sky.setHex(a.sky).lerp(_colB.setHex(b.sky),k);
  const sunI=lerp(a.sunI,b.sunI,k), hemiI=lerp(a.hemi,b.hemi,k), ambI=lerp(a.amb,b.amb,k);
  _sky.lerp(_gray, ST.rain*0.68);
  scene.background.copy(_sky);
  scene.fog.color.copy(_sky);
  scene.fog.density=0.0046+0.004*ST.rain;
  const ang=(t-6)/12*Math.PI, elevN=Math.sin(ang);
  SUN.position.set(-Math.cos(ang)*34, Math.max(5,elevN*30+2), 16);
  SUN.color.setHex(a.sun).lerp(_colA.setHex(b.sun),k);
  SUN.intensity=sunI*(1-0.72*ST.rain);
  HEMI.intensity=hemiI*(1-0.4*ST.rain)+0.04;
  AMB.intensity=ambI*(1-0.3*ST.rain);
  const nightF=ST.nightF=clamp01((0.14-elevN)/0.32);
  // 夜晚灯效
  M.glass.emissiveIntensity=nightF*1.5+ST.rain*0.12;
  M.cabGlass.emissiveIntensity=nightF*0.9;
  M.headLight.emissiveIntensity=nightF*1.7;
  M.lampOn.emissiveIntensity=0.06+nightF*1.9;
  lampGlowMat.opacity=clamp01(nightF*1.15-0.06)*(0.8+0.4*ST.rain);
  poolGlowMat.opacity=lampGlowMat.opacity*0.7;
  M.beacon.emissiveIntensity=0.15+nightF*(1.0+1.0*Math.sin(ST.elapsed*4.6));
  SPOT_PIT.intensity=nightF*(85+55*ST.rain);
  SPOT_BLD.intensity=nightF*(65+45*ST.rain);
  // 湿地
  wetMats.forEach(w=>{
    w.mat.roughness=lerp(w.baseRough,0.34,ST.wet);
    w.mat.color.copy(w.baseColor).multiplyScalar(1-0.24*ST.wet);
  });
  dustSys.mat.uniforms.uTime.value=ST.elapsed;
  dustSys.mat.uniforms.uIntensity.value=dustAmt()*(1-ST.rain*0.9);
  rainSys.mat.uniforms.uTime.value=ST.elapsed;
  rainSys.mat.uniforms.uRain.value=ST.rain;
  rainSys.pts.visible=ST.rain>0.015;
}

function updateCamera(dt){

  camera.position.set(
    cam.target.x+Math.sin(cam.yaw)*cp*cam.dist,
    cam.target.y+Math.sin(cam.pitch)*cam.dist,

}

  let dragging=false, dragKnob=-1, lastX=0,lastY=0, startX=0, startT=0, moved=0;
  el.addEventListener('pointerdown',e=>{
    lastAct=performance.now();
    ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
    raycaster.setFromCamera(ndc,camera);
    const hits=raycaster.intersectObjects(knobMeshes,false);
    if(hits.length){ dragKnob=hits[0].object.userData.knob; startT=knobValue(dragKnob); startX=e.clientX; moved=0; }
    else { dragging=true; lastX=e.clientX; lastY=e.clientY; }
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove',e=>{
    if(dragKnob>=0){
      const t=clamp(startT+(e.clientX-startX)*0.0042,0,1);
      setKnobValue(dragKnob,t);
      moved+=1;
    } else if(dragging){
      cam.yaw-=(e.clientX-lastX)*0.005;
      cam.pitch=clamp(cam.pitch+(e.clientY-lastY)*0.004,0.12,1.32);
      lastX=e.clientX; lastY=e.clientY;
    } else {
      ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
      raycaster.setFromCamera(ndc,camera);
      const hits=raycaster.intersectObjects(knobMeshes,false);
      el.style.cursor=hits.length?'pointer':'grab';
    }
    lastAct=performance.now();
  });
  const endDrag=e=>{
    dragging=false;
    if(dragKnob>=0){ setKnobValue(dragKnob,knobValue(dragKnob)); dragKnob=-1; }
    lastAct=performance.now();
  };
  el.addEventListener('pointerup',endDrag);
  el.addEventListener('pointercancel',endDrag);
  el.addEventListener('wheel',e=>{
    e.preventDefault();
    cam.dist=clamp(cam.dist*(1+e.deltaY*0.0011),16,72);
    lastAct=performance.now();
  },{passive:false});
  window.addEventListener('keydown',e=>{
    if(e.code==='Space'){ e.preventDefault(); ST.rainOn=!ST.rainOn; lastAct=performance.now(); }
  });
  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
}

// ========================================
// HUD
// ========================================
function initHUD(){
  ['hStatus','hTime','hWeather','hDust','hSpeed','hMach','hWork','hFps'].forEach(id=>hudEls[id]=document.getElementById(id));
  hudEls.hMach.textContent=String(2+3+1+1);
  hudEls.hWork.textContent=String(WORKERS.length);
}
const pad2=n=>String(n).padStart(2,'0');
function updateHUD(fps){
  hudEls.hTime.textContent=pad2(Math.floor(ST.time))+':'+pad2(Math.floor((ST.time%1)*60));
  hudEls.hWeather.textContent=ST.rainOn?'RAIN':'CLEAR';
  hudEls.hDust.textContent=['LOW','MEDIUM','HIGH'][ST.dustIdx];
  hudEls.hSpeed.textContent=ST.speedPresets[ST.speedIdx].toFixed(1)+'×';
  hudEls.hFps.textContent=String(fps);
  hudEls.hStatus.innerHTML=(timeMult()>0?'RUNNING':'STANDBY')+'<i class="dot"></i>';
}

// ========================================
// RENDER — 主循环
// ========================================
function initRenderer(){
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.13;
  document.body.appendChild(renderer.domElement);
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0b1020);
  scene.fog=new THREE.FogExp2(0x0b1020,0.0046);
  camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.5,300);
  SUN=new THREE.DirectionalLight(0xffffff,1.6);
  SUN.castShadow=true;
  SUN.shadow.mapSize.set(2048,2048);
  const sc=SUN.shadow.camera;
  sc.left=-27; sc.right=27; sc.top=22; sc.bottom=-22; sc.near=2; sc.far=110;
  sc.updateProjectionMatrix();
  SUN.shadow.bias=-0.0004; SUN.shadow.normalBias=0.03;
  scene.add(SUN); scene.add(SUN.target);
  HEMI=new THREE.HemisphereLight(0xbfd4e8,0x4a3b2a,0.5); scene.add(HEMI);
  AMB=new THREE.AmbientLight(0xffffff,0.35); scene.add(AMB);
  SPOT_PIT=new THREE.SpotLight(0xffedc0,0,20,0.62,0.5,1.4);
  SPOT_PIT.position.set(-14.2,GROUND+2.6,-4.6);
  SPOT_PIT.target.position.set(-18.6,GROUND-1.5,2.2);
  scene.add(SPOT_PIT); scene.add(SPOT_PIT.target);
  SPOT_BLD=new THREE.SpotLight(0xffedc0,0,22,0.6,0.5,1.4);
  SPOT_BLD.position.set(12.4,GROUND+2.6,3.2);
  SPOT_BLD.target.position.set(6.5,GROUND+6,-2);
  scene.add(SPOT_BLD); scene.add(SPOT_BLD.target);
}
const clock=new THREE.Clock();
let fpsFrames=0, fpsTime=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  ST.elapsed+=dt;
  updateVehicles(dt);
  updateDigs(dt);
  updateCranes(dt);
  updateWorkers(dt,ST.elapsed);
  DYN.forEach(f=>f(dt,ST.elapsed));
  if(barrierArm){
    let near=1e9;
    VEHICLES.forEach(v=>{ const d=Math.hypot(v.g.position.x-8.4,v.g.position.z-13.6); if(d<near)near=d; });
    const tgt=near<5?1.3:0;
    barrierArm.rotation.z+=(tgt-barrierArm.rotation.z)*Math.min(1,dt*3);
  }
  updateWeatherDay(dt);
  if(flagMat) flagMat.uniforms.uTime.value=ST.elapsed;
  burst.update(dt);
  updateCamera(dt);
  fpsFrames++; fpsTime+=dt;
  if(fpsTime>0.5){ updateHUD(Math.round(fpsFrames/fpsTime)); fpsFrames=0; fpsTime=0; }
  renderer.render(scene,camera);
}

// ========================================
// INIT
// ========================================
function init(){
  initRenderer();
  buildAllPools();
  buildEnvironment();
  buildSandboxBase();
  buildGround();
  buildPit();
  buildBuilding();
  buildSteelShed();
  buildMaterialZone();
  buildDumpZone();
  buildOffices();
  buildGate();
  buildLamps();
  buildPolesWires();
  buildDetails();
  buildStatic();
  buildCranes();
  buildExcavators();
  buildVehicles();
  buildWorkers();
  buildParticles();
  initHUD();
  initInput();
  updateWeatherDay(0.016);
  animate();
  setTimeout(()=>document.getElementById('loader').classList.add('done'),300);
  setTimeout(()=>{ const l=document.getElementById('loader'); if(l) l.remove(); },1400);
}
init();

}catch(err){
  document.getElementById('lErr').textContent = 'ERROR: '+err.message;
  console.error(err.stack||err);
}
